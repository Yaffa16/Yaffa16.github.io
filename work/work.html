<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/wwc.css">
<style>
.page-top {
  padding: clamp(84px, 14vh, 130px) var(--pad) 26px;
  display: flex; justify-content: space-between; align-items: baseline;
  flex-wrap: wrap; gap: 12px;
}
.page-top h1 { font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.filters { display: flex; flex-wrap: wrap; gap: 14px; padding: 0 var(--pad) 20px; }
.chip {
  font-family: inherit; font-size: 10px; letter-spacing: .12em;
  text-transform: uppercase; background: none; border: 0;
  color: var(--dim); cursor: pointer; padding: 0;
  transition: color .3s;
}
.chip:hover { color: var(--ink); }
.chip.on { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>

<header class="uv-head">
  <a class="uv-mark" href="../index.html">Weird With Code<sup>&#174;</sup></a>
  <nav class="uv-nav">
    <a href="../index.html">Projects</a>
    <a href="work.html" class="now">Index</a>
    <a href="bio.html">Studio</a>
    <button type="button" data-overlay-open>Contact</button>
  </nav>
</header>

<section class="page-top">
  <h1 data-rise>Index</h1>
  <span class="uv-micro uv-num" data-rise style="--d:100ms" id="total"></span>
</section>

<div class="filters" id="filters" data-rise style="--d:150ms"></div>

<main class="uv-list" id="list"></main>

<footer class="uv-foot">
  <a href="../index.html">&#8592; Projects</a>
  <span>Jiyo &#183; Aur &#183; Jeene &#183; Do</span>
  <span>Yasha Jain &#169; 2026</span>
</footer>

<div id="uv-overlay" aria-hidden="true" role="dialog" aria-label="Contact">
  <div class="uv-ov-top">
    <span class="uv-micro">Contact</span>
    <button type="button" class="uv-ov-close" data-overlay-close>Close</button>
  </div>
  <div class="uv-ov-mid">
    <a href="mailto:jain.yasha@gmail.com">jain.yasha@gmail.com</a>
    <a href="mailto:jain@zkm.de">jain@zkm.de</a>
    <a href="https://www.instagram.com/yaffa16/" target="_blank" rel="noopener noreferrer">@yaffa16</a>
  </div>
  <div class="uv-ov-foot">
    <span>Karlsruhe, Germany</span>
    <span>Open to commissions, exhibitions &amp; talks</span>
  </div>
</div>

<script>window.WC_BASE = '';</script>
<script src="../assets/works.js"></script>
<script>
(function () {
  var BASE = window.WC_BASE || '';
  var list = document.getElementById('list');
  var filters = document.getElementById('filters');
  document.getElementById('total').textContent =
    '(' + String(window.WC_FLAT.length).padStart(2, '0') + ')';

  function render(year) {
    var rows = window.WC_FLAT.filter(function (w) {
      return year === 'all' || w.year === year;
    });
    list.innerHTML = rows.map(function (w) {
      // No data-peek: that attribute is what makes wwc.js spawn the
      // image that follows the cursor. The index is a plain text list.
      return '<a class="uv-row" href="' + BASE + w.href + '">' +
        '<span class="n">' + w.n + '</span>' +
        '<span class="t">' + w.title + '</span>' +
        '<span class="g">' + w.tags + '</span>' +
        '<span class="y">' + w.venue + ' &#8212; ' + w.year + '</span>' +
        '</a>';
    }).join('');
    
  }

  var years = window.WC_WORKS.map(function (g) { return g.year; });
  function chip(label, val, on) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (on ? ' on' : '');
    b.textContent = label;
    b.__val = val;
    return b;
  }
  filters.appendChild(chip('All', 'all', true));
  years.forEach(function (y) { filters.appendChild(chip(y, y, false)); });

  filters.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    filters.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('on'); });
    b.classList.add('on');
    render(b.__val);
  });

  render('all');
})();
</script>
<script src="../assets/wwc.js" defer></script>
</body>
</html>
