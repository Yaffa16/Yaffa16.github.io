<script>
/* =================================================================
   THE DECK
   Panes recede along a bottom-left -> top-right diagonal in 3D.
   Wheel / drag scrubs the stack (front pane recycles to the back),
   mouse position parallaxes the whole deck, hovering a pane
   flattens it toward the viewer. Click opens the project.
   ================================================================= */
(function () {
  'use strict';
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FINE = matchMedia('(pointer: fine)').matches;

  var rows = window.WC_FLAT;

  // Flat index list (also the fallback on touch / reduced motion)
  var list = document.getElementById('homeList');
  list.innerHTML = rows.map(function (w) {
    // No data-peek here: that attribute is what makes wwc.js spawn the
    // image that floats beside the cursor. The Index view is a plain
    // text list.
    return '<a class="uv-row" href="work/' + w.href + '">' +
      '<span class="n">' + w.n + '</span>' +
      '<span class="t">' + w.title + '</span>' +
      '<span class="g">' + w.tags + '</span>' +
      '<span class="y">' + w.venue + ' &#8212; ' + w.year + '</span></a>';
  }).join('');

  // Overview / Index switch
  var sw = document.getElementById('switch');
  sw.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (!b) return;
    sw.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    document.body.classList.toggle('mode-index', b.dataset.mode === 'index');
    document.body.classList.toggle('mode-overview', b.dataset.mode === 'overview');
    if (b.dataset.mode === 'index') window.scrollTo(0, 0);
  });

  if (RM) {   // reduced motion only; touch keeps the deck
    document.body.classList.remove('mode-overview');
    document.body.classList.add('mode-index');
    return; // no deck
  }

  var deck = document.getElementById('deck');
  var stage = document.getElementById('stage');
  var caption = document.getElementById('caption');
  var capT = caption.querySelector('.t');
  var capY = caption.querySelector('.yr');

  var N = rows.length;

  /* Three frame formats, proportioned from the reference dimensions
     and expressed as fractions of --cardw so they scale with the
     viewport: tall portrait (680x905), wide landscape (904x550) and
     a moderate landscape in between (820x700). */
  var FRAMES = [
    { w: 0.75, h: 1.00 },   // 680 x 905
    { w: 1.00, h: 0.61 },   // 904 x 550
    { w: 0.91, h: 0.77 }    // 820 x 700
  ];

  var cards = rows.map(function (w, i) {
    var a = document.createElement('a');
    a.className = 'uv-card';
    a.href = 'work/' + w.href;
    a.setAttribute('aria-label', w.title + ', ' + w.year);
    a.draggable = false;
    var fr = FRAMES[i % FRAMES.length];
    a.style.setProperty('--cw', 'calc(var(--cardw) * ' + fr.w + ')');
    a.style.setProperty('--ch', 'calc(var(--cardw) * ' + fr.h + ')');
    var blur = document.createElement('img');
    blur.className = 'uv-blur'; blur.alt = ''; blur.draggable = false;
    blur.src = 'work/' + w.img; blur.loading = 'eager'; blur.decoding = 'async';
    var img = document.createElement('img');
    img.className = 'uv-sharp';
    img.draggable = false;
    img.src = 'work/' + w.img;
    img.alt = w.title;
    img.loading = 'eager'; // 22 thumbs; blank glass panes look broken
    img.decoding = 'async';
    if (img.complete && img.naturalWidth) a.classList.add('ready');
    else img.addEventListener('load', function () { a.classList.add('ready'); });
    img.addEventListener('error', function () { a.remove(); });
    a.appendChild(blur);
    a.appendChild(img);
    var edge = document.createElement('span'); edge.className = 'uv-edge';
    var edgeB = document.createElement('span'); edgeB.className = 'uv-edge-b';
    a.appendChild(edge);
    a.appendChild(edgeB);
    deck.appendChild(a);
    return { el: a, data: w, hovered: false, flat: 0 };
  });

  /* Path geometry, per unit of depth rank */
  /* Steps are a fraction of the pane width so the stack fills the
     frame identically at any viewport. 0.34 / 0.37 is a ~47deg
     diagonal, matching the measured reference. */
  var STEP_X = 0, STEP_Y = 0, STEP_Z = 0;
  function sizeSteps() {
    var cw = cards[0] ? cards[0].el.offsetWidth : 320;
    STEP_X = cw * 0.42;
    STEP_Y = cw * 0.36;   // flatter climb, still legible
    STEP_Z = cw * 0.42;   // shallow depth step: a deep one compresses
                          // the far end into the vanishing point and
                          // leaves the right of the frame empty
    cards.forEach(function (c) { c.hw = 0; c.hh = 0; });
  }
  sizeSteps();
  addEventListener('resize', sizeSteps);
  /* Where the front pane sits, as a fraction of the viewport from
     centre. Phones are narrow and tall, so the stack has to start
     nearer the middle or most of it sits off-frame. */
  var BASE_X = -0.36, BASE_Y = 0.56;
  function sizeBase() {
    var narrow = innerWidth < 700;
    BASE_X = narrow ? -0.26 : -0.36;
    BASE_Y = narrow ?  0.26 :  0.56;
  }
  sizeBase();
  addEventListener('resize', sizeBase);
  /* The panes are turned in 3D. A flat CSS skew can reproduce the
     measured corner angles but not the look: in the reference those
     angles come from a rotated plane seen in perspective, so the image
     foreshortens across the pane. Rotation is the real effect.  */
  var TILT = -45;   // rotateY: pane turns to face left (base yaw)

  /* Extra rotation per axis, added on top of TILT. All three are
     applied to the pane AND to its hit-testing quad, so clicks stay on
     the pane whatever you set here.
       ROT_X  pitch — tips the top toward you (+) or away (-)
       ROT_Y  yaw   — extra turn left/right, added to TILT
       ROT_Z  roll  — spins the pane in its own plane            */
  var ROT_X = -15;
  var ROT_Y = 20;
  var ROT_Z =0;
  var SKEW  = 0;    // in-plane shear, normally none

  var offset = 0, shown = 0;            // scrub position (in card units)
  var px = 0, py = 0, cpx = 0, cpy = 0; // parallax
  var lerp = function (a, b, n) { return a + (b - a) * n; };

  var rawX = innerWidth / 2, rawY = innerHeight / 2;
  addEventListener('mousemove', function (e) {
    px = e.clientX / innerWidth - 0.5;
    py = e.clientY / innerHeight - 0.5;
    rawX = e.clientX; rawY = e.clientY;
  }, { passive: true });

  /* Wheel scrubs the deck instead of scrolling the page */
  var lastInput = 0;
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (navigating) return;
    offset += (e.deltaY + e.deltaX) * 0.0022;
    lastInput = performance.now();
  }, { passive: false });

  /* Drag scrub + click-to-open.
     The panes are re-transformed every animation frame, so a pane can
     shift between pointerdown and pointerup; the browser then refuses
     to synthesize a click at all. Navigation therefore keys off the
     pane captured at pointerdown, fired on pointerup when the pointer
     barely moved. Native clicks on panes are suppressed to avoid a
     double navigation through the global link handler. */
  var dragging = false, dragX = 0, dragY = 0, moved = 0, downCard = null;
  stage.addEventListener('pointerdown', function (e) {
    if (navigating) return;
    dragging = true; dragX = e.clientX; dragY = e.clientY; moved = 0;
    // Fresh strict test at the press point; fall back to the sticky
    // hover only if the press is actually within its sticky margin.
    downCard = hitTest(e.clientX, e.clientY) ||
               hitTestDrawn(e.clientX, e.clientY) ||
               (stickyContains(hoverCard, e.clientX, e.clientY) ? hoverCard : null);
  });
  addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var d = e.clientX - dragX; dragX = e.clientX;
    var dy = e.clientY - (dragY || e.clientY); dragY = e.clientY;
    moved += Math.abs(d) + Math.abs(dy);
    if (moved <= 14) return; // still within click slop: don't scrub yet
    // near 1:1 with the on-screen step of ~155px per card, diagonal-aware
    offset -= (d - dy) * 0.0058;
    lastInput = performance.now();
  });
  // Trackpad clicks usually include a few px of movement; anything
  // under CLICK_SLOP counts as a click, not a drag.
  var CLICK_SLOP = FINE ? 14 : 22;   // fingers wobble more than mice
  // Belt and braces: never let the browser start a native drag from a
  // pane, and treat a cancelled pointer like a released one so drag
  // state can't stick.
  document.addEventListener('dragstart', function (e) {
    if (e.target.closest && e.target.closest('.uv-card')) e.preventDefault();
  });
  addEventListener('pointercancel', function () {
    dragging = false; downCard = null;
  });
  addEventListener('pointerup', function (e) {
    dragging = false;
    if (moved <= CLICK_SLOP) {
      if (downCard) {
        openProject(downCard);
      }
      // Clicks on empty space do nothing: scrubbing is drag/wheel only.
    }
    downCard = null;
  });
  deck.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.uv-card')) {
      e.preventDefault(); e.stopPropagation();
    }
  }, true);

  var navigating = false;
  // Returning via back/forward cache must not leave the page faded
  // out or navigation locked.
  addEventListener('pageshow', function () {
    navigating = false;
    focusCard = null; focusT = 0;
    document.body.style.opacity = '1';
  });
  /* Clicking a pane previews it before leaving: the pane travels to
     the centre of the screen at a slightly larger size and turns
     face-on, every other pane fades away, then the project page
     loads. */
  var focusCard = null, focusT = 0, focusStart = 0;
  // The pane takes FOCUS_MS to land centre-screen, then HOLD_MS of
  // stillness on the enlarged image before the project page loads.
  var FOCUS_MS = 420;
  var HOLD_MS  = 1000;
  var LEAVE_MS = FOCUS_MS + HOLD_MS;
  function openProject(card) {
    if (navigating) return;
    navigating = true;
    focusCard = card;
    focusStart = performance.now();
    caption.classList.remove('on');
    stage.style.cursor = '';
    setTimeout(function () {
      location.href = card.el.getAttribute('href');
    }, LEAVE_MS);
  }
  /* ---- own hit-testing --------------------------------------------
     Each frame stores every pane's projected screen quad; hover and
     clicks are resolved against those quads, nearest pane wins. */
  var P3 = 9500, hoverCard = null, capW = 0, capH = 0;
  addEventListener('resize', function () {
    cards.forEach(function (c) { c.hw = 0; c.hh = 0; });
  });

  function project(wx, wy, wz) {
    // Straight perspective projection about the origin — the deck no
    // longer rotates, so there is no parallax term to undo here.
    var Ox = 0, Oy = -0.04 * innerHeight;
    var s = P3 / (P3 - wz);
    return [Ox + (wx - Ox) * s + innerWidth / 2,
            Oy + (wy - Oy) * s + innerHeight / 2, wz];
  }
  function inQuad(q, px2, py2) {
    var sgn = 0;
    for (var i = 0; i < 4; i++) {
      var A = q[i], B = q[(i + 1) % 4];
      var cr = (B[0] - A[0]) * (py2 - A[1]) - (B[1] - A[1]) * (px2 - A[0]);
      if (cr !== 0) {
        var t = cr > 0 ? 1 : -1;
        if (sgn === 0) sgn = t; else if (t !== sgn) return false;
      }
    }
    return true;
  }
  function hitTest(px2, py2) {
    var best = null;
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (!c.quad || c.fade <= 0.5) continue;
      if (inQuad(c.quad, px2, py2) && (!best || c.zc > best.zc)) best = c;
    }
    return best;
  }
  // For clicks: the pane the user can SEE under the pointer, slid or not.
  function hitTestDrawn(px2, py2) {
    var best = null;
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (!c.drawnQuad || c.fade <= 0.5) continue;
      if (inQuad(c.drawnQuad, px2, py2) && (!best || c.zc > best.zc)) best = c;
    }
    return best;
  }
  function stickyContains(c, px2, py2) {
    if (!c || !c.quad) return false;
    var cx2 = 0, cy2 = 0;
    for (var i = 0; i < 4; i++) { cx2 += c.quad[i][0] / 4; cy2 += c.quad[i][1] / 4; }
    var big = c.quad.map(function (p3) {
      return [cx2 + (p3[0] - cx2) * 1.18, cy2 + (p3[1] - cy2) * 1.18];
    });
    return inQuad(big, px2, py2);
  }
  function setHover(hit) {
    if (hit === hoverCard) return;
    if (hoverCard) hoverCard.hovered = false;
    hoverCard = hit;
    if (hit) {
      hit.hovered = true;
      capT.textContent = hit.data.title;
      capY.textContent = hit.data.n + ' \u2014 ' + hit.data.year;
      caption.classList.add('on');
      capW = caption.offsetWidth; capH = caption.offsetHeight;
      stage.style.cursor = 'pointer';
    } else {
      caption.classList.remove('on');
      stage.style.cursor = '';
    }
  }

  function frame() {
    // After 400ms without input, settle onto the nearest whole card so
    // the front pane always sits cleanly on the grid.
    if (!dragging && performance.now() - lastInput > 400) {
      offset = lerp(offset, Math.round(offset), 0.10);
    }
    shown = lerp(shown, offset, 0.08);
    cpx = lerp(cpx, px, 0.06);
    cpy = lerp(cpy, py, 0.06);

    // Popup trails the cursor but never leaves the viewport: it flips
    // to the left of the pointer near the right edge, and above it near
    // the bottom.
    var cw = capW, ch = capH;
    var capX = rawX + 18, capY = rawY + 20;
    if (capX + cw > innerWidth - 8) capX = rawX - cw - 14;
    if (capY + ch > innerHeight - 8) capY = rawY - ch - 14;
    caption.style.transform =
      'translate3d(' + capX + 'px,' + capY + 'px,0)';
    // No deck rotation. The mouse-parallax rotateX was tipping the whole
    // stack backwards; rotateY went with it. The panes' own left-facing
    // TILT is the only rotation in the scene now.
    deck.style.transform = 'none';

    if (focusCard) {
      // Time-based: a slow frame must not leave the preview unfinished.
      var fp = Math.min(1, (performance.now() - focusStart) / FOCUS_MS);
      focusT = 1 - Math.pow(1 - fp, 3);   // ease-out
    }

    var W = innerWidth, H = innerHeight;
    cards.forEach(function (c, i) {
      // depth rank 0 (front) .. N-1 (deep), fractional for smoothness
      var r = (i - shown) % N; if (r < 0) r += N;
      c.flat = lerp(c.flat, c.hovered ? 1 : 0, 0.34); // immediate

      // Hover slides the pane sideways ONLY: same depth, same tilt,
      // same size. No pull toward the viewer (that made it "come up"),
      // no rotation. SLIDE is the whole gesture.
      // Deeper panes are drawn smaller by perspective, so the world-
      // space shift is scaled by (P - z) / P to keep the ON-SCREEN
      // slide the same distance at every rank.
      var P = 9500;                       // matches CSS perspective
      var x0 = BASE_X * W + r * STEP_X;
      var y0 = BASE_Y * H - r * STEP_Y;
      var z0 = -r * STEP_Z;
      var f = c.flat;
      var SLIDE = 300;                     // on-screen px, to the right
      var x = x0 + SLIDE * ((P - z0) / P) * f;
      var y = y0;
      var z = z0;
      var rot = TILT;

      // Fade only the deep end; a wrapping card crosses the front at
      // full opacity, jumps to the deep end already faded to zero,
      // then fades back in as it advances. The front stays solid.
      var fade = r > N - 1.6 ? Math.max(0, (N - r) / 1.6) : 1;

      var haze = Math.min(0.10, Math.max(0, (r - 2.2) * 0.0117)); // 1/3 fog
      var zi = 1000 - Math.round(r * 10);

      if (focusCard) {
        if (c === focusCard) {
          // Centre it: with screen = O + (world - O) * P/(P - z), the
          // world position that lands dead centre is O * (1 - 1/s).
          var Ox2 = 0, Oy2 = -0.04 * H;
          var zF = 300, sF = P / (P - zF);          // ~1.17x its rest size
          var xF = Ox2 * (1 - 1 / sF), yF = Oy2 * (1 - 1 / sF);
          var ft2 = focusT;
          x = x + (xF - x) * ft2;
          y = y + (yF - y) * ft2;
          z = z + (zF - z) * ft2;
          // the shear eases out with focusT, applied below
          haze = haze * (1 - ft2);
          fade = 1;
          zi = 4000;
        } else {
          fade *= (1 - Math.min(1, focusT * 1.6));  // everything else clears
        }
      }

      var ease = focusCard === c ? (1 - focusT) : 1;   // preview flattens all
      var ax = ROT_X * ease,
          ay = (rot + ROT_Y) * ease,
          az = ROT_Z * ease,
          sk = SKEW * ease;
      c.el.style.transform =
        'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,' + z.toFixed(1) + 'px)' +
        ' rotateX(' + ax.toFixed(2) + 'deg)' +
        ' rotateY(' + ay.toFixed(2) + 'deg)' +
        ' rotateZ(' + az.toFixed(2) + 'deg)' +
        (sk ? ' skewY(' + sk.toFixed(2) + 'deg)' : '');
      c.el.style.opacity = fade.toFixed(3);
      c.el.style.setProperty('--haze', haze.toFixed(3));
      c.el.style.zIndex = String(zi);

      // projected screen quad for our own hit-testing
      c.fade = fade;
      // Panes have three different shapes now, so each caches its own
      // half-width/half-height for hit-testing.
      if (!c.hw) { c.hw = c.el.offsetWidth / 2; c.hh = c.el.offsetHeight / 2; }
      var HW2 = c.hw, HH2 = c.hh;
      // Rotate each corner the way the CSS does — rotateX, then
      // rotateY, then rotateZ — so the clickable quad matches the
      // drawn pane on all three axes.
      var RX = ax * Math.PI / 180, RY = ay * Math.PI / 180, RZ = az * Math.PI / 180;
      var cX = Math.cos(RX), sX = Math.sin(RX),
          cY = Math.cos(RY), sY = Math.sin(RY),
          cZ = Math.cos(RZ), sZ = Math.sin(RZ);
      var tk = Math.tan(sk * Math.PI / 180);
      // HIT-TESTING USES THE PANE'S RESTING POSITION, NOT ITS SLID ONE.
      // Building it from the slid position creates a feedback loop:
      // hovering slides the pane away from the cursor, the cursor is
      // then outside it, hover drops, it slides back under the cursor,
      // hover fires again -> flicker. Worse between two panes, where
      // each one sliding away exposes the other. Testing against the
      // rest position breaks the loop: what the cursor is "over" never
      // changes because of the hover itself.
      function quadAt(qx, qy, qz) {
        return [[-HW2, -HH2], [HW2, -HH2], [HW2, HH2], [-HW2, HH2]].map(function (p2) {
          var px0 = p2[0], py0 = p2[1] + p2[0] * tk;                // shear
          var x1 = px0 * cZ - py0 * sZ, y1 = px0 * sZ + py0 * cZ;   // roll
          var x2 = x1 * cY, z2 = -x1 * sY;                          // yaw
          var y3 = y1 * cX - z2 * sX, z3 = y1 * sX + z2 * cX;       // pitch
          return project(qx + x2, qy + y3, qz + z3);
        });
      }
      c.quad = quadAt(x0, y0, z0);      // resting geometry
      c.drawnQuad = quadAt(x, y, z);    // where it is actually painted
      c.zc = project(x0, y0, z0)[2];   // stable depth ordering
    });
    if (!FINE) {
      // Touch: caption always describes the front-most pane.
      var front = null;
      for (var fi = 0; fi < cards.length; fi++) {
        var fc = cards[fi];
        if (fc.fade > 0.5 && (!front || fc.zc > front.zc)) front = fc;
      }
      if (front && front !== hoverCard) {
        hoverCard = front;
        // NB: `capY` is shadowed inside this function by the caption's
        // y position, so reach for the element directly.
        caption.querySelector('.t').textContent = front.data.title;
        caption.querySelector('.yr').textContent =
          front.data.n + ' \u2014 ' + front.data.year;
        caption.classList.add('on');
      }
      requestAnimationFrame(frame);
      return;
    }
    var hitNow = hitTest(rawX, rawY);
    if (!hitNow && stickyContains(hoverCard, rawX, rawY)) hitNow = hoverCard;
    setHover(hitNow);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script src="assets/wwc.js" defer></script>
